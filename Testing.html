const isi = (s, v = {}) => String(s).replace(/\{(\w+)\}/g, (_, k) => v[k] ?? "");
const T = (k, v) => {
  const s = (TEKS[KONFIG.bahasa] || TEKS.id)[k] ?? TEKS.id[k] ?? k;
  return Array.isArray(s) ? s.map(x => isi(x, v)) : isi(s, v);
};

const slugify = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
  .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
const SESI = (() => { try { return (new URLSearchParams(location.search).get("sesi") || "").trim().slice(0, 40); } catch (e) { return ""; } })();
const ID_DASAR = KONFIG.idUjian || ("ujian-" + slugify(`${KONFIG.mapel}-${KONFIG.jenisUjian}-${KONFIG.judul}`));
const ID_UJIAN = ID_DASAR + (SESI ? "-sesi-" + (slugify(SESI) || encodeURIComponent(SESI)) : "");
const KUNCI_SANDI = "smkmikael:sandi:" + ID_UJIAN;
const KUNCI_RESET = "smkmikael:reset:" + ID_UJIAN;
const KUNCI_SIMPAN = "smkmikael:kuis:" + ID_UJIAN;
const PAKAI_BOBOT = KONFIG.modeNilai === "bobot";

const S = {
  mulai: false, selesai: false, direset: false,
  soal: [], jawaban: [], indeks: 0,
  pelanggaran: [], sisaDetik: KONFIG.durasiMenit * 60,
  timer: null, terakhirPelanggaran: 0, overlayTerbuka: false, dialogTerbuka: false,

};

const $ = id => document.getElementById(id);
const huruf = "ABCDEFGH";
const pad = n => String(n).padStart(2, "0");
const fmtWaktu = d => `${pad(Math.floor(d / 60))}:${pad(d % 60)}`;
const fmtAngka = n => Number(n).toLocaleString(KONFIG.bahasa === "en" ? "en-US" : "id-ID", { maximumFractionDigits: 2 });
const jamSekarang = () => new Date().toLocaleTimeString("id-ID", { hour12: false });
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const cocokKode = (s, kode) => Array.isArray(kode) && kode.length > 0 && s.length === kode.length
  && [...s].every((c, i) => c.charCodeAt(0) + 7 === kode[i]);
const acak = a => { for (let i = a.length - 1; i > 0; i--) { const k = Math.floor(Math.random() * (i + 1)); [a[i], a[k]] = [a[k], a[i]]; } return a; };
const terjawab = i => S.jawaban[i] !== null && S.jawaban[i] !== undefined && String(S.jawaban[i]).trim() !== "";
const bobotSoal = s => PAKAI_BOBOT && Number(s.b) > 0 ? Number(s.b) : 1;

/* ---- pencocokan jawaban isian: huruf kecil, spasi rapi, titik akhir dibuang, padanan diterapkan ---- */
const normDasar = s => String(s ?? "").toLowerCase().replace(/[\u2019\u2018`\u00b4]/g, "'")
  .replace(/\s+/g, " ").trim().replace(/[.!?]+$/, "").trim();
const PADANAN = [].concat(KONFIG.padanan || [])
  .map(b => String(b).split("=").map(normDasar).filter(Boolean))
  .filter(g => g.length > 1)
  .flatMap(g => g.slice(1).map(v => [v, g[0]]))
  .sort((a, b) => b[0].length - a[0].length);
const norm = s => {
  let t = " " + normDasar(s) + " ";
  PADANAN.forEach(([v, c]) => {
    for (let n = 0; n < 5 && t.includes(` ${v} `); n++) t = t.split(` ${v} `).join(` ${c} `);
  });
  return t.replace(/\s+/g, " ").trim();
};
const benarkah = i => {
  const s = S.soal[i], j = S.jawaban[i];
  if (!terjawab(i)) return false;
  return s.t === "pg" ? j === s.j : [].concat(s.j).some(k => norm(k) === norm(j));
};

function periksaBank() {
  const err = [];
  if (!BANK_SOAL.length) return ["Belum ada soal."];
  BANK_SOAL.forEach((pk, a) => {
    const nm = pk.nama || `Paket ${a + 1}`;
    if (!Array.isArray(pk.soal) || !pk.soal.length) { err.push(`${nm}: belum ada soal.`); return; }
    pk.soal.forEach((s, i) => {
      const no = `${nm} no. ${i + 1}`;
      if (!s || !String(s.q || "").trim()) err.push(`${no}: teks soal kosong.`);
      if (s.t === "pg") {
        if (!Array.isArray(s.p) || s.p.length < 2 || s.p.length > 8) err.push(`${no}: pilihan harus 2–8 opsi.`);
        else if (!Number.isInteger(s.j) || s.j < 0 || s.j >= s.p.length) err.push(`${no}: kunci belum benar.`);
      } else if (s.t === "isian") {
        if (![].concat(s.j ?? []).filter(x => String(x).trim()).length) err.push(`${no}: kunci isian kosong.`);
      } else err.push(`${no}: jenis soal tidak dikenal.`);
      if (PAKAI_BOBOT && s.b !== undefined && !(Number(s.b) > 0)) err.push(`${no}: bobot tidak valid.`);
    });
  });
  return err;
}

async function mintaLayarPenuh() {
  const el = document.documentElement;
  try { await (el.requestFullscreen || el.webkitRequestFullscreen).call(el); } catch (e) {}
}
const dalamLayarPenuh = () => !!(document.fullscreenElement || document.webkitFullscreenElement);

function sisaDetikSekarang() {
  if (!S.tenggat) return KONFIG.durasiMenit * 60;
  return Math.max(0, Math.round((S.tenggat - Date.now()) / 1000));
}
function detak() {
  S.sisaDetik = sisaDetikSekarang();
  $("waktu").textContent = fmtWaktu(S.sisaDetik);
  if (S.sisaDetik <= 60) $("pilWaktu").classList.add("bahaya");
  if (S.sisaDetik <= 0) selesaikan("waktu");
}

function catatPelanggaran(alasan, senyap) {
  if (!S.mulai || S.selesai || S.overlayTerbuka || S.dialogTerbuka || S.terjemahTerbuka) return;
  const kini = Date.now();
  if (kini - S.terakhirPelanggaran < 1500) return;
  S.terakhirPelanggaran = kini;
  S.pelanggaran.push({ jam: jamSekarang(), alasan, soal: S.indeks + 1 });
  const n = S.pelanggaran.length;
  kirimKeSheet({ jenis: "pelanggaran", kuis: KONFIG.judul, mapel: KONFIG.mapel, sesi: SESI, paket: S.paket,
                 nama: S.nama, kelas: S.kelas, jam: jamSekarang(), alasan, soal: S.indeks + 1, urutan: n });
  $("pelanggaranTeks").textContent = `${n}/${KONFIG.maksPelanggaran}`;
  $("pilPelanggaran").classList.add("bahaya");
  simpanProgres();
  if (n >= KONFIG.maksPelanggaran) { selesaikan("kunci"); return; }
  if (senyap) return;
  S.overlayTerbuka = true;
  $("tiraiHitung").textContent = n;
  $("tiraiAlasan").textContent = alasan + ".";
  const sisa = KONFIG.maksPelanggaran - n;
  $("tiraiSisa").textContent = sisa === 1 ? T("tiraiSisa1") : T("tiraiSisaN", { n: sisa });
  $("tirai").classList.add("tampil");
}

$("btnKembali").addEventListener("click", async () => {

document.addEventListener("visibilitychange", () => { if (document.hidden) catatPelanggaran(T("al_tab")); });
window.addEventListener("blur", () => catatPelanggaran(T("al_blur")));
document.addEventListener("fullscreenchange", () => { if (!dalamLayarPenuh()) catatPelanggaran(T("al_layar")); });
document.addEventListener("webkitfullscreenchange", () => { if (!dalamLayarPenuh()) catatPelanggaran(T("al_layar")); });

const sedangUjian = () => S.mulai && !S.selesai;

["copy", "cut", "paste"].forEach(ev => document.addEventListener(ev, e => { if (sedangUjian()) e.preventDefault(); }));
document.addEventListener("keydown", e => {

  const k = e.key.toLowerCase();
  const blok = e.key === "F12" || e.key === "F5" || e.key === "Escape"
    || ((e.ctrlKey || e.metaKey) && ["c","v","x","u","s","p","t","n","w","r"].includes(k))
    || (e.ctrlKey && e.shiftKey && ["i","j","c"].includes(k))
    || (e.altKey && e.key === "Tab");
  if (blok) e.preventDefault();
});

function renderSoal() {
  const i = S.indeks, s = S.soal[i], total = S.soal.length;
  $("nomor").innerHTML = `${T("soalKe", { i: i + 1 })}<span> / ${total}</span>`;
  $("jenis").textContent = (s.t === "pg" ? T("jenisPG") : T("jenisIsian"))
    + (PAKAI_BOBOT ? ` \u00b7 ${T("bobot")} ${fmtAngka(bobotSoal(s))}` : "");
  $("pertanyaan").textContent = s.q;
  if (s.t === "pg") {
    $("opsi").innerHTML = s.p.map((p, j) => `
      <label>
        <input type="radio" name="jwb" value="${j}" ${S.jawaban[i] === j ? "checked" : ""}>
        <span class="huruf">${huruf[j]}</span><span>${esc(p)}</span>
      </label>`).join("");
    $("opsi").querySelectorAll("input").forEach(r => r.addEventListener("change", () => {
      S.jawaban[i] = Number(r.value);
      renderNav();
      simpanProgres();
    }));
  } else {
    $("opsi").innerHTML = `
      <div class="isian">
        <input type="text" id="jwbIsian" autocomplete="off" spellcheck="false"
               placeholder="${esc(T("phIsian"))}" value="${esc(S.jawaban[i] ?? "")}">
        <div class="petunjuk" id="petunjukIsian"></div>
      </div>`;
    $("petunjukIsian").textContent = s.h || KONFIG.petunjukIsian || T("petunjukIsian");
    const inp = $("jwbIsian");
    inp.addEventListener("input", () => { S.jawaban[i] = inp.value; renderNav(); simpanNanti(); });
    inp.addEventListener("keydown", e => { if (e.key === "Enter" && i < total - 1) { S.indeks++; renderSoal(); } });
    inp.focus();
  }
  $("btnSebelum").disabled = i === 0;
  $("btnBerikut").disabled = i === total - 1;
  renderNav();
}

function renderNav() {
  const total = S.soal.length;

  $("kumpulInfo").textContent = nJawab === total ? T("kumpulSemua") : T("kumpulSisa", { n: total - nJawab });

  }).join("");

    S.indeks = Number(b.dataset.i); renderSoal(); simpanProgres();

function selesaikan(kode) {
  if (S.selesai) return;
  const cara = T("cara_" + kode);
  S.selesai = true;
  S.sisaDetik = sisaDetikSekarang();
  clearInterval(S.timer);
  $("tirai").classList.remove("tampil");
  $("dialogKumpul").classList.remove("tampil");
  S.overlayTerbuka = false; S.dialogTerbuka = false;
  if (dalamLayarPenuh() && document.exitFullscreen) document.exitFullscreen().catch(() => {});

  const total = S.soal.length;
  const benar = S.soal.filter((_, i) => benarkah(i)).length;
  const kosong = S.soal.filter((_, i) => !terjawab(i)).length;
  const salah = total - benar - kosong;
  const poinTotal = S.soal.reduce((n, s) => n + bobotSoal(s), 0);
  const poinBenar = S.soal.reduce((n, s, i) => n + (benarkah(i) ? bobotSoal(s) : 0), 0);
  const skor = poinTotal ? Math.round(poinBenar / poinTotal * 100) : 0;
  const durasi = KONFIG.durasiMenit * 60 - S.sisaDetik;

  isiSkor({ skor, benar, salah, kosong, total, durasi: fmtWaktu(durasi),
            cara, caraKode: kode, nama: S.nama, kelas: S.kelas, pelanggaran: S.pelanggaran });

  const teksJawab = i => {
    const s = S.soal[i], j = S.jawaban[i];
    if (!terjawab(i)) return "-";
    return s.t === "pg" ? huruf[j] : String(j).trim();
  };
  $("rekapWrap").hidden = !KONFIG.tampilkanRincian;
  $("rekapJawaban").innerHTML = S.soal.map((s, i) => {
    const st = !terjawab(i) ? "kosong" : benarkah(i) ? "ok" : "salah";
    const tanda = st === "ok" ? "\u2713" : st === "salah" ? "\u2715" : "\u2013";
    let ket = !terjawab(i) ? T("tidakDijawab")
      : s.t === "pg" ? `${T("jawabanmu")}: ${huruf[S.jawaban[i]]}. ${esc(s.p[S.jawaban[i]])}`
      : `${T("jawabanmu")}: ${esc(teksJawab(i))}`;
    if (KONFIG.tampilkanKunci && st !== "ok") ket += ` \u00b7 ${T("kunciBenar")}: ${esc(s.t === "pg" ? s.p[s.j] : [].concat(s.j)[0])}`;
    if (PAKAI_BOBOT) ket += ` \u00b7 ${T("bobot")} ${fmtAngka(bobotSoal(s))}`;
    return `<div class="rekap-item"><span class="tanda ${st}">${tanda}</span>
      <div><div class="tq">${i + 1}. ${esc(s.q)}</div><div class="ket">${ket}</div></div></div>`;
  }).join("");

  const jawabanUrut = S.soal.map((s, i) => ({ n: s.asli + 1, v: teksJawab(i), ok: benarkah(i) })).sort((a, b) => a.n - b.n);
  S.jawabanTeks = jawabanUrut.filter(x => !x.ok).map(x => `${x.n}:${x.v}`).join(" | ");

  const kunciAsli = s => {
    const asli = BANK_SOAL[S.rencana.paket].soal[s.asli];
    return asli.t === "pg" ? `${huruf[asli.j]}. ${asli.p[asli.j]}` : [].concat(asli.j)[0];
  };
  const jawabTeksPenuh = i => {
    const s = S.soal[i], j = S.jawaban[i];
    if (!terjawab(i)) return "-";
    return s.t === "pg" ? s.p[j] : String(j).trim();
  };
  S.detail = S.soal.map((s, i) => ({
    no: s.asli + 1, tipe: s.t === "pg" ? "PG" : "Isian", bobot: bobotSoal(s), soal: s.q,
    jawaban: jawabTeksPenuh(i), kunci: kunciAsli(s), benar: benarkah(i) ? 1 : 0
  })).sort((a, b) => a.no - b.no);
  const daftarSalah = S.detail.filter(d => !d.benar);
  S.salahNomor = daftarSalah.map(d => d.no).join(", ");
  S.salahRincian = daftarSalah.map(d => `#${d.no} ${d.soal} → jawab: ${d.jawaban} | kunci: ${d.kunci}`).join("\n");

  const semuaLog = S.pelanggaran.map(p => `<li><time>${p.jam}</time><span>${esc(p.alasan)} ${T("logSoal", { n: p.soal })}</span></li>`)
    .concat(S.logTerjemah.map(p => `<li><time>${p.jam}</time><span>${esc(p.alasan)} ${T("logSoal", { n: p.soal })} \u00b7 ${T("tidakDihitung")}</span></li>`));
  $("logPelanggaran").innerHTML = semuaLog.length ? semuaLog.join("") : `<li class="kosong-log">${T("tanpaPelanggaran")}</li>`;

  S.ringkasan = [
    `${T("r_ujian")}: ${KONFIG.mapel ? KONFIG.mapel + " — " : ""}${KONFIG.judul} (${labelPaket()})`,
    `${T("r_nama")}: ${S.nama} | ${T("r_kelas")}: ${S.kelas}`,
    `${T("r_nilai")}: ${skor} (${benar}/${total})` + (PAKAI_BOBOT ? ` | ${T("r_poin")}: ${fmtAngka(poinBenar)}/${fmtAngka(poinTotal)}` : "") + ` | Status: ${cara}`,
    `${T("r_mulai")}: ${S.waktuMulai.toLocaleString("id-ID")} | ${T("waktuDipakai")}: ${fmtWaktu(durasi)}`,
    `${T("pelanggaran")}: ${S.pelanggaran.length}`,
    ...S.pelanggaran.map(p => `  - ${p.jam} ${p.alasan} ${T("logSoal", { n: p.soal })}`),
    `${T("r_terjemah")}: ${S.logTerjemah.length}`,
    ...S.logTerjemah.map(p => `  - ${p.jam} ${p.alasan} ${T("logSoal", { n: p.soal })}`),
    `${T("r_salah")}: ${S.jawabanTeks || T("r_tidakAda")}`
  ].join("\n");

  S.caraSelesai = cara; S.caraKode = kode; S.skorAkhir = skor; S.benarAkhir = benar;
  S.salahAkhir = salah; S.kosongAkhir = kosong; S.durasiAkhir = fmtWaktu(durasi);
  simpanProgres();

  statusKop(false);
  tampilkan("layarHasil");
  window.scrollTo(0, 0);

  kirimHasil({
    jenis: "hasil", kuis: KONFIG.judul, mapel: KONFIG.mapel, jenisUjian: KONFIG.jenisUjian, sesi: SESI,
    paket: S.paket, nama: S.nama, kelas: S.kelas,
    mulai: S.waktuMulai.toLocaleString("id-ID"), durasi: fmtWaktu(durasi),
    skor, benar, total, status: cara,
    modeNilai: PAKAI_BOBOT ? "Bobot" : "Otomatis", poinBenar, poinTotal,
    jumlahPelanggaran: S.pelanggaran.length,
    pelanggaran: S.pelanggaran.map(p => `${p.jam} ${p.alasan} ${T("logSoal", { n: p.soal })}`).join("; "),
    jawaban: S.jawabanTeks, salahNomor: S.salahNomor, salahRincian: S.salahRincian,
    detail: S.detail
  });
}

function kirimKeSheet(data) {
  if (!KONFIG.sheetUrl) return Promise.resolve(false);
  return fetch(KONFIG.sheetUrl, {
    method: "POST", mode: "no-cors", keepalive: true,
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(data)
  }).then(() => true).catch(() => false);
}

async function kirimHasil(data) {
  const el = $("statusKirim");
  if (!KONFIG.sheetUrl) { el.hidden = true; return; }
  el.hidden = false;
  el.className = "kirim proses";
  el.textContent = T("kirimProses");
  let ok = await kirimKeSheet(data);
  if (!ok) { await new Promise(r => setTimeout(r, 2000)); ok = await kirimKeSheet(data); }
  el.className = "kirim " + (ok ? "ok" : "gagal");
  el.textContent = ok ? T("kirimOk") : T("kirimGagal");
}

$("btnSalin").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(S.ringkasan); $("labelSalin").textContent = T("tersalin"); }
  catch { prompt(T("salinPrompt"), S.ringkasan); }
});

function tampilkan(id) {
  document.querySelectorAll(".layar").forEach(l => l.classList.remove("aktif"));
  $(id).classList.add("aktif");
}

function tutupReset() { $("dialogReset").classList.remove("tampil"); }
$("btnReset").addEventListener("click", () => {
  $("resetSandi").value = "";
  $("resetSalah").textContent = "";
  $("dialogReset").classList.add("tampil");
  setTimeout(() => $("resetSandi").focus(), 30);
});
$("btnBatalReset").addEventListener("click", tutupReset);
$("resetForm").addEventListener("submit", e => {
  e.preventDefault();
  const inp = $("resetSandi");
  if (cocokKode(inp.value.trim(), KONFIG.resetKode)) {
    S.direset = true;
    clearTimeout(S.tundaSimpan);
    hapusSimpanan();
    try { sessionStorage.removeItem(KUNCI_SANDI); sessionStorage.setItem(KUNCI_RESET, "1"); } catch (err) {}
    location.replace(location.pathname + location.search + location.hash);
  } else {
    $("resetSalah").textContent = T("resetSalah");
    inp.value = ""; inp.focus();
    goyangkan($("resetForm"));
  }
});

const sandiIn  = o => btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const sandiOut = s => JSON.parse(decodeURIComponent(escape(atob(s))));
function bacaSimpanan() {
  try { const r = localStorage.getItem(KUNCI_SIMPAN); return r ? sandiOut(r) : null; }
  catch (e) { return null; }
}
function hapusSimpanan() { try { localStorage.removeItem(KUNCI_SIMPAN); } catch (e) {} }

function simpanProgres() {
  if (S.direset || !KONFIG.simpanProgres || !S.mulai || !S.rencana) return;
  try {
    localStorage.setItem(KUNCI_SIMPAN, sandiIn({
      v: 3, id: ID_UJIAN, dimulai: true,
      nama: S.nama, kelas: S.kelas, rencana: S.rencana,
      jawaban: S.jawaban, indeks: S.indeks,
      pelanggaran: S.pelanggaran, logTerjemah: S.logTerjemah,
      mulaiEpoch: S.mulaiEpoch, tenggat: S.tenggat,
      selesai: S.selesai, cara: S.caraSelesai || "", caraKode: S.caraKode || "",
      skor: S.skorAkhir ?? null, benar: S.benarAkhir ?? null,
      salah: S.salahAkhir ?? null, kosong: S.kosongAkhir ?? null,
      total: S.soal.length, durasi: S.durasiAkhir || "",
      ringkasan: S.ringkasan || ""
    }));
  } catch (e) {}
}
function kunciRencana() {
  try {
    const ada = bacaSimpanan();
    if (ada && ada.id === ID_UJIAN && ada.dimulai !== false) return;
    localStorage.setItem(KUNCI_SIMPAN, sandiIn({ v: 3, id: ID_UJIAN, dimulai: false, rencana: S.rencana }));
  } catch (e) {}
}
function simpanNanti() { clearTimeout(S.tundaSimpan); S.tundaSimpan = setTimeout(simpanProgres, 400); }
window.addEventListener("pagehide", simpanProgres);

function buatRencana() {
  const iPaket = KONFIG.acakPaket ? Math.floor(Math.random() * BANK_SOAL.length) : 0;
  const soal = BANK_SOAL[iPaket].soal;
  const urut = soal.map((_, i) => i);
  if (KONFIG.acakSoal) acak(urut);
  const pilihan = {};
  soal.forEach((s, i) => { if (s.t === "pg" && KONFIG.acakPilihan) pilihan[i] = acak(s.p.map((_, k) => k)); });
  return { paket: iPaket, urut, pilihan };
}
function rencanaSah(r) {
  const pk = r && BANK_SOAL[r.paket];
  return !!(pk && Array.isArray(r.urut) && r.urut.length === pk.soal.length && r.urut.every(i => pk.soal[i]));
}
function terapkanRencana(r) {
  const pk = BANK_SOAL[r.paket] || BANK_SOAL[0];
  S.rencana = r;
  S.paket = pk.nama || `Paket ${r.paket + 1}`;
  S.soal = r.urut.map(i => {
    const s = pk.soal[i], soal = { ...s, asli: i };
    const ord = r.pilihan ? r.pilihan[i] : null;
    if (s.t === "pg" && Array.isArray(ord) && ord.length === s.p.length) {
      soal.p = ord.map(k => s.p[k]);
      soal.j = ord.indexOf(s.j);
    }
    return soal;
  });
  const n = S.soal.length, nPG = S.soal.filter(s => s.t === "pg").length, nIsian = n - nPG;
  const info = nPG && nIsian ? T("infoCampur", { n, pg: nPG, isian: nIsian }) : nPG ? T("infoPG", { n }) : T("infoIsian", { n });
  renderAturan(info, nIsian > 0);
  $("statSoal").textContent = n;
  $("kopJudul").textContent = `${KONFIG.judul} \u00b7 ${labelPaket()}`;
}

function tampilkanLanjut() {
  const jml = S.soal.filter((_, j) => terjawab(j)).length;
  $("lanjutNama").textContent = S.nama || "-";
  $("lanjutKelas").textContent = `${S.kelas || "-"} \u00b7 ${labelPaket()}`;
  $("lanjutJawab").textContent = `${jml}/${S.soal.length}`;
  $("lanjutWaktu").textContent = fmtWaktu(sisaDetikSekarang());
  $("lanjutPelanggaran").textContent = `${S.pelanggaran.length}/${KONFIG.maksPelanggaran}`;
  $("lanjutCatatan").textContent = KONFIG.refreshJadiPelanggaran ? T("catatanLanjutRefresh") : T("catatanLanjut");
  $("waktu").textContent = fmtWaktu(sisaDetikSekarang());
  tampilkan("layarLanjut");
}

function tampilkanTerkunci(d) {
  S.selesai = true;
  isiSkor(d);
  S.ringkasan = d.ringkasan || "";
  $("bannerSelesai").hidden = false;
  $("rekapWrap").hidden = true;
  $("logWrap").hidden = true;
  $("statusKirim").hidden = true;
  statusKop(false);
  tampilkan("layarHasil");
}

function terjemahanAktif() {
  const h = document.documentElement;
  if (h.classList.contains("translated-ltr") || h.classList.contains("translated-rtl")) return true;
  if (document.querySelector(".goog-te-banner-frame, .skiptranslate, #goog-gt-tt")) return true;
  if (document.querySelector("font[_msttexthash], [_msthash], [_mstmutation]")) return true;
  if (document.querySelector("font[style*='vertical-align']")) return true;
  return false;
}
function periksaTerjemahan() {
  if (!KONFIG.blokirTerjemahan || S.terjemahTerbuka) return;
  if (!terjemahanAktif()) return;
  S.terjemahTerbuka = true;
  if (S.mulai && !S.selesai) {
    const catatan = { jam: jamSekarang(), alasan: T("al_terjemah"), soal: S.indeks + 1 };
    S.logTerjemah.push(catatan);
    kirimKeSheet({ jenis: "pelanggaran", kuis: KONFIG.judul, mapel: KONFIG.mapel, sesi: SESI, paket: S.paket,
                   nama: S.nama, kelas: S.kelas, jam: catatan.jam, alasan: catatan.alasan, soal: catatan.soal,
                   urutan: S.pelanggaran.length + S.logTerjemah.length });
    simpanProgres();
  }
  $("terjemahMasihAktif").hidden = true;
  $("tiraiTerjemahan").classList.add("tampil");
}
$("btnTerjemahanSelesai").addEventListener("click", async () => {
  if (terjemahanAktif()) { $("terjemahMasihAktif").hidden = false; return; }
  $("tiraiTerjemahan").classList.remove("tampil");
  S.terjemahTerbuka = false;
  S.terakhirPelanggaran = Date.now();
  if (S.mulai && !S.selesai) await mintaLayarPenuh();
});
function jagaBahasa() {
  if (!KONFIG.blokirTerjemahan) return;
  try {
    new MutationObserver(periksaTerjemahan).observe(document.documentElement, {
      attributes: true, attributeFilter: ["class", "lang", "_msthash"], childList: true, subtree: true
    });
  } catch (e) {}
  setInterval(periksaTerjemahan, 1500);
  periksaTerjemahan();
}

(function jalan() {
  siapkanTampilan();
  try {
    if (sessionStorage.getItem(KUNCI_RESET) === "1") $("bannerReset").hidden = false;
    sessionStorage.removeItem(KUNCI_RESET);
  } catch (e) {}
  siapkanGerbang();

  const galat = periksaBank();
  if (galat.length) {
    $("bannerBank").textContent = `Bank soal perlu diperbaiki (${galat.length}):\n` + galat.slice(0, 8).join("\n");
    $("bannerBank").hidden = false;
    $("btnMulai").disabled = true;
    renderAturan("-", false);
    tampilkan("layarMulai");
    return;
  }

  const d = bacaSimpanan();
  const cocok = d && d.id === ID_UJIAN && rencanaSah(d.rencana);

  if (cocok && d.dimulai !== false && KONFIG.simpanProgres) {
    terapkanRencana(d.rencana);
    S.nama = d.nama; S.kelas = d.kelas;
    S.jawaban = Array.isArray(d.jawaban) && d.jawaban.length === S.soal.length ? d.jawaban : S.soal.map(() => null);
    S.indeks = Math.min(Math.max(0, d.indeks || 0), S.soal.length - 1);
    S.pelanggaran = d.pelanggaran || [];
    S.logTerjemah = d.logTerjemah || [];
    S.mulaiEpoch = d.mulaiEpoch || Date.now();
    S.tenggat = d.tenggat || (S.mulaiEpoch + KONFIG.durasiMenit * 60 * 1000);
    S.waktuMulai = new Date(S.mulaiEpoch);
    S.sisaDetik = sisaDetikSekarang();
    jagaBahasa();
    if (d.selesai) { tampilkanTerkunci(d); return; }
    if (KONFIG.waktuTerusBerjalan && sisaDetikSekarang() <= 0) { S.mulai = true; selesaikan("waktu"); return; }
    tampilkanLanjut();
    return;
  }

  terapkanRencana(cocok ? d.rencana : buatRencana());
  kunciRencana();
  S.jawaban = S.soal.map(() => null);
  $("waktu").textContent = fmtWaktu(KONFIG.durasiMenit * 60);
  jagaBahasa();
  tampilkan("layarMulai");
})();
</script>
